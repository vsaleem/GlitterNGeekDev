name: Continuous Integration
run-name: ${{ github.actor }}💜 is running CI for ${{ github.ref }} ✨💜🌟✨💜🌟✨

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  actions: write

# concurrency:
#   group: ${{ github.ref != 'refs/heads/main' && github.ref || github.sha }}
#   cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
# TEMPORARY: This check will be removed once Shai Hulud 2.0 is no longer a moving target
  # Blocks dependency and lockfile changes while allowing non-dependency package scripts.
  check-dependency-files:
    name: Check for Dependency File Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@cd7d8d697e10461458bc61a30d094dc601a8b017
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: main/.nvmrc

      - name: Check for dependency or lockfile changes
        run: |
          git fetch origin main

          if git diff --name-only origin/main...HEAD | grep -q '^main/package.json$'; then
            git show origin/main:main/package.json > /tmp/package-main.json

            for section in dependencies devDependencies optionalDependencies peerDependencies resolutions; do
              if [ "$section" = "dependencies" ]; then
                jq -S '.dependencies // {} | .["@supabase/ssr"] = "^0.12.3" | .["@supabase/supabase-js"] = "^2.110.8"' \
                  /tmp/package-main.json > /tmp/package-main-dependencies.json
                if ! diff -u \
                  /tmp/package-main-dependencies.json \
                  <(jq -S '.dependencies // {}' main/package.json); then
                  echo "❌ ERROR: package.json dependencies differ from the reviewed Supabase allowlist."
                  exit 1
                fi
                continue
              fi

              if ! diff -u \
                <(jq -S ".${section} // {}" /tmp/package-main.json) \
                <(jq -S ".${section} // {}" main/package.json); then
                echo "❌ ERROR: package.json dependency section '${section}' was modified."
                exit 1
              fi
            done

            expected_overrides='{"@istanbuljs/load-nyc-config":{"js-yaml":"3.15.0"},"next":{"postcss":"8.5.16"}}'
            if [ "$(jq -cS '.overrides // {}' main/package.json)" != "$(printf '%s' "$expected_overrides" | jq -cS '.')" ]; then
              echo "❌ ERROR: package.json overrides differ from the reviewed security allowlist."
              exit 1
            fi
          fi

          if git diff --name-only origin/main...HEAD | grep -qE '^main/(package-lock\.json|npm-shrinkwrap\.json|yarn\.lock)$'; then
            cp main/package-lock.json /tmp/package-lock.committed.json
            (
              cd main
              npm install --package-lock-only --ignore-scripts
              diff -u /tmp/package-lock.committed.json package-lock.json
              npm ci --ignore-scripts
              npm audit --json > /tmp/audit-head.json || true
            )
            if ! jq -e '.vulnerabilities | type == "object"' /tmp/audit-head.json >/dev/null; then
              echo "❌ ERROR: npm returned an invalid audit response for the proposed lockfile."
              exit 1
            fi

            mkdir -p /tmp/audit-baseline
            git show origin/main:main/package.json > /tmp/audit-baseline/package.json
            git show origin/main:main/package-lock.json > /tmp/audit-baseline/package-lock.json
            (
              cd /tmp/audit-baseline
              npm ci --ignore-scripts
              npm audit --json > /tmp/audit-baseline.json || true
            )
            if ! jq -e '.vulnerabilities | type == "object"' /tmp/audit-baseline.json >/dev/null; then
              echo "❌ ERROR: npm returned an invalid audit response for the baseline lockfile."
              exit 1
            fi

            jq -r '
              [.vulnerabilities[].via[]?
                | select(type == "object")
                | .url]
              | unique[]
            ' /tmp/audit-head.json | sort > /tmp/audit-head-urls.txt
            jq -r '
              [.vulnerabilities[].via[]?
                | select(type == "object")
                | .url]
              | unique[]
            ' /tmp/audit-baseline.json | sort > /tmp/audit-baseline-urls.txt

            new_advisories="$(
              comm -13 /tmp/audit-baseline-urls.txt /tmp/audit-head-urls.txt
            )"
            if [ -n "$new_advisories" ]; then
              echo "❌ ERROR: dependency changes introduced new advisories:"
              printf '%s\n' "$new_advisories"
              exit 1
            fi

            echo "✓ No new dependency advisories were introduced."
            jq '.metadata.vulnerabilities' /tmp/audit-head.json
          fi

          echo "✓ Dependency declarations, security overrides, and lockfiles passed policy."

      - name: Cancel workflow on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });

  lint-typecheck-build:
    name: Lint, Typecheck, and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main
    steps:
      - name: Checkout
        uses: actions/checkout@cd7d8d697e10461458bc61a30d094dc601a8b017

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: main/.nvmrc
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main
    steps:
      - name: Checkout
        uses: actions/checkout@cd7d8d697e10461458bc61a30d094dc601a8b017

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: main/.nvmrc
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

