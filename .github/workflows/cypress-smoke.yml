name: Cypress Smoke Tests

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cypress-smoke:
    name: Cypress Smoke Tests
    runs-on: ubuntu-latest
    env:
      GNG_LEARNING_APP_ENABLED: "true"
      GNG_LEARNING_DEV_ACCESS: "true"
      GNG_LEARNING_DEV_EMAIL: victoria@example.com
      GNG_LEARNING_DEV_NAME: Victoria
      GNG_LEARNING_DEV_ENTITLEMENTS: quick-start
    defaults:
      run:
        working-directory: main
    steps:
      - name: Checkout
        uses: actions/checkout@cd7d8d697e10461458bc61a30d094dc601a8b017

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: main/.nvmrc
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Cypress smoke tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: main
          start: npm run dev
          wait-on: "http://localhost:3000"
          wait-on-timeout: 60
          browser: chrome

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: main/cypress/screenshots
          if-no-files-found: ignore
