name: Deploy Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: main/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  deploy-dev:
    name: Deploy Dev
    runs-on: ubuntu-latest
    needs: build
    environment: Build (Dev)
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploy to dev here"

  check-dev:
    name: Check Dev
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - run: echo "Run dev smoke tests here"

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: check-dev
    environment: Build (Staging)
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploy to staging here"

  check-staging:
    name: Check Staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - run: echo "Run staging smoke tests here"

  deploy-prod:
    name: Deploy Prod
    runs-on: ubuntu-latest
    needs: check-staging
    environment: Build (Prod)
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploy to prod here"
